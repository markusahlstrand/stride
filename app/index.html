<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + the safe-area insets in styles.css keep the bottom
         nav clear of the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The chrome follows the OS the way the palette does: one theme-color per
         scheme, matching --bg-deep on each side — paper, and the chalkboard. -->
    <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
    <!-- Bricolage Grotesque says words, DM Mono says numbers, and Caveat Brush is
         the pencil in the margin. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat+Brush&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- The mark is one of the cast: the `run` pose from src/figures.tsx on a
         mint field — a FigureTile at icon scale. A pinned icon cannot follow the
         OS the way the app does, so its colours are frozen on the mint side.
         Sources are app/public/*.svg; the PNGs beside them are derived. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS reads the name off this one, not off <title>, when you pin it. -->
    <meta name="apple-mobile-web-app-title" content="Stride" />
    <meta name="application-name" content="Stride" />
    <title>Stride</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
